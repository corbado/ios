name: observe-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Pre-warm simulator runtimes
        # macos runners intermittently list zero iOS destinations on first use — kick
        # CoreSimulator and wait for the runtimes to register before running tests.
        run: |
          sudo xcodebuild -runFirstLaunch
          for i in $(seq 1 12); do
            xcrun simctl list devices available | grep -q "iPhone" && break
            sleep 5
          done
          xcrun simctl list devices available | grep -q "iPhone"

      - name: Format check (swift format)
        run: swift format lint --strict --recursive observe

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Static analysis (SwiftLint)
        run: swiftlint --strict

      - name: Unit tests (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme corbado-ios \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build example app
        run: |
          cd examples/observe && xcodegen generate
          xcodebuild build \
            -project ObserveExample.xcodeproj \
            -scheme ObserveExample \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
